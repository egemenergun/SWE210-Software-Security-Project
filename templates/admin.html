<!DOCTYPE html>
<html>
<head><title>Admin Panel - Secure App</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"></head>
<body class="container mt-5">
    <h1>Admin Panel - Registered Users</h1>
    <table class="table">
        <thead><tr><th>Username</th><th>Role</th></tr></thead>
        <tbody>
            {% for user in users %}
            <tr><td>{{ user.username }}</td><td>{{ user.role }}</td></tr>
            {% endfor %}
        </tbody>
    </table>
    <a href="/dashboard" class="btn btn-primary">Back to Dashboard</a>
</body>
</html>
