<!DOCTYPE html>
<html>
<head><title>Dashboard - Secure App</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"></head>
<body class="container mt-5">
    <h1>Dashboard</h1>
    <p>Welcome, <b>{{ current_user.username }}</b>! Your role is: <span class="badge bg-info text-dark">{{ current_user.role }}</span></p>
    <hr>
    <h3>Encryption Test</h3>
    <form method="POST">
        <input type="text" name="data" class="form-control mb-2" placeholder="Sensitive data text (e.g. Champion Galatasaray)" required>
        <button type="submit" class="btn btn-warning">Save encrypted value</button>
    </form>
    <p class="mt-3">Display (decrypted when rendering): <b>{{ decrypted_data }}</b></p>
    <hr>
    {% if current_user.role == 'admin' %}
        <a href="/admin" class="btn btn-danger">Go to admin panel</a>
    {% endif %}
    <a href="/logout" class="btn btn-secondary">Log out</a>
</body>
</html>
